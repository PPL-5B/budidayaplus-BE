version: '3.8'
services:
  web:
    build: .
    command: sh -c "gunicorn --workers 3 --bind 0.0.0.0:${PORT} budidayaplus.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "${PORT}:${PORT}"
    
    env_file:
      - .env
    environment:
      - DEBUG=1
      # - DB_HOST=db
      # - DB_NAME=postgres
      # - DB_USER=postgres
      # - DB_PASS=postgres
      # - DB_PORT=5432