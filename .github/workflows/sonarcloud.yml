name: SonarCloud CI
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for diff-cover

    # If pull request, fetch target branch for diff coverage
    - name: Fetch base branch for PRs
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage diff-cover

    - name: Configure Database
      run: |
        echo "DB_NAME=test_db" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASS=postgres" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV

    - name: Run Migrations
      env:
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASS: postgres
        DB_HOST: localhost
        DB_PORT: 5432
      run: python manage.py migrate

    - name: Run Tests with Coverage
      id: run_tests
      env:
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASS: postgres
        DB_HOST: localhost
        DB_PORT: 5432
      continue-on-error: true  # Allow failures for debugging
      run: |
        coverage run manage.py test || echo "Some tests failed, continuing..."
    
    # Debug: Check if .coverage file exists
    - name: Debug - Check if .coverage file exists
      run: |
        ls -alh
        if [ -f .coverage ]; then
          echo "✅ .coverage file exists."
        else
          echo "❌ .coverage file is missing!"
          exit 1
        fi

    - name: Generate Coverage XML
      run: |
        coverage xml || echo "Failed to generate coverage.xml"

    # Check coverage threshold for new code only
    - name: Check New Code Coverage Threshold
      id: coverage_check
      if: github.event_name == 'pull_request' && github.base_ref == 'dev'
      run: |
        COVERAGE_THRESHOLD=90
        
        # Generate diff-cover report against base branch
        diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --html-report=diff_coverage_report.html
        
        # Extract new code coverage percentage
        NEW_CODE_COVERAGE=$(diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} | grep "Coverage: " | sed 's/Coverage: \([0-9.]*\)%.*/\1/')
        
        echo "New code coverage percentage: $NEW_CODE_COVERAGE%"
        echo "coverage_percent=$NEW_CODE_COVERAGE" >> $GITHUB_OUTPUT
        
        # Check if coverage meets threshold
        if (( $(echo "$NEW_CODE_COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
          echo "❌ New code coverage is below the required threshold of $COVERAGE_THRESHOLD% (Current: $NEW_CODE_COVERAGE%)"
          echo "coverage_status=failed" >> $GITHUB_OUTPUT
        else
          echo "✅ New code coverage meets the required threshold of $COVERAGE_THRESHOLD% (Current: $NEW_CODE_COVERAGE%)"
          echo "coverage_status=success" >> $GITHUB_OUTPUT
        fi
    
    # Create a GitHub status check for coverage (now checking new code only)
    - name: Create Coverage Status Check
      if: github.event_name == 'pull_request' && github.base_ref == 'dev'
      run: |
        if [[ "${{ steps.coverage_check.outputs.coverage_status }}" == "failed" ]]; then
          echo "::error::Coverage below threshold: Required 90%, Current ${{ steps.coverage_check.outputs.coverage_percent }}%"
          exit 1
        else
          echo "✅ Coverage meets threshold: Required 90%, Current ${{ steps.coverage_check.outputs.coverage_percent }}%"
        fi

    # Debug: Check if coverage.xml was created
    - name: Debug - Check if coverage.xml file exists
      run: |
        ls -alh
        if [ -f coverage.xml ]; then
          echo "✅ coverage.xml file exists."
        else
          echo "❌ coverage.xml file is missing!"
          exit 1
        fi

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          diff_coverage_report.html

  sonarcloud:
    needs: build-test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Coverage Report
      uses: actions/download-artifact@v4
      with:
        name: coverage-report

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION_KEY }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.python.version=3.12
          -Dsonar.sources=.
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.exclusions=**/migrations/**, locustfile.py, manage.py
          -Dsonar.coverage.exclusions=**/tests/**,**/migrations/**,**/__init__.py,**/admin.py,**/apps.py