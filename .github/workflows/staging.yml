name: CI/CD Pipeline to Deploy on Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
    types:
      - closed

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VM via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} << EOF
            set -e

            cd /home/andromeda/dkn/budidayaplus-staging

            # Pastikan backup folder ada
            mkdir -p ./backups

            TIMESTAMP=\$(date +%F_%H-%M-%S)

            echo "Creating database backup: backups/backup_before_\$TIMESTAMP.sql"
            docker-compose exec -T db pg_dump -U \$DB_USER \$DB_NAME -f /var/lib/postgresql/data/backups/backup_before_\$TIMESTAMP.sql

            git pull origin staging
            docker-compose down

            rm -f .env
            touch .env
            echo DEBUG=1 >> .env
            echo DB_HOST=${{ secrets.DB_HOST }} >> .env
            echo DB_NAME=${{ secrets.DB_NAME }} >> .env
            echo DB_USER=${{ secrets.DB_USER }} >> .env
            echo DB_PASS=${{ secrets.DB_PASS }} >> .env
            echo DB_PORT=${{ secrets.DB_PORT }} >> .env
            echo PORT=8000 >> .env

            docker-compose up --build -d
            sleep 10

            bash scripts/load_fixtures.sh
          EOF

