name: CI/CD Pipeline to Deploy on Staging
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
    types:
      - closed

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VM via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} << 'EOF'
            cd /home/andromeda/dkn/budidayaplus-staging
            git pull origin staging
            docker-compose down
            rm .env
            touch .env
            echo DEBUG=1 >> .env
            echo DB_HOST=${{ secrets.DB_HOST }} >> .env
            echo DB_NAME=${{ secrets.DB_NAME }} >> .env
            echo DB_USER=${{ secrets.DB_USER }} >> .env
            echo DB_PASS=${{ secrets.DB_PASS }} >> .env
            echo DB_PORT=${{ secrets.DB_PORT }} >> .env
            echo PORT=8000 >> .env
            docker-compose up --build -d

            sleep 10

            # Hapus seluruh isi database
            docker-compose exec web python manage.py flush --noinput
            # Load data dari seeding/fixtures dan tasks/fixtures
            docker-compose exec web python manage.py loaddata \
              seeding/fixtures/01_user.json \
              seeding/fixtures/03_pond.json \
              seeding/fixtures/04_cycle.json \
              seeding/fixtures/05_pondfishamount.json \
              seeding/fixtures/06_pondquality.json \
              seeding/fixtures/07_fishdeath.json \
              seeding/fixtures/08_fishsampling.json \
              seeding/fixtures/09_foodsampling.json \
              seeding/fixtures/10_forum.json \
              tasks/fixtures/data.json || true
          EOF